org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP gates Kotlin compilation of src/testFixtures sources behind this
# experimental flag (AGP 8.5+, Kotlin 1.9.20+). Without it :core:storage's
# testFixtures Kotlin sources are never compiled into the testFixtures variant.
android.experimental.enableTestFixturesKotlinSupport=true
