[versions]
# Build toolchain. Pinned to the mutually-compatible set resolved by M0-T01
# (see docs/ANDROID-CONSTRAINTS.md "V1 addendum — resolved catalog"):
#   Kotlin 2.3.21 (KGP fully supported with Gradle 7.6.3-9.3.0, AGP 8.2.2-9.0.0)
#   KSP 2.3.12    (documented KGP support 2.2.10-2.3.x)
#   AGP 8.13.2    (max API 36.1, min Gradle 8.13; keeps the kotlin-android plugin,
#                  which AGP 9.x deprecates in favour of built-in Kotlin)
#   Gradle 8.14.5 (wrapper; inside Kotlin 2.3.21's range and above AGP 8.13's min)
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.12"

# Androidx / Compose
# 2026.06.01 (Compose UI 1.11.4, Material3 1.4.0) is the newest BOM whose AAR
# metadata stays at minCompileSdk 35 / minAGP 8.6.0. BOM 2026.08.00 (UI 1.12.0)
# and newer require compileSdk 37 + AGP 9.1.0, which the compileSdk 36 decision
# rules out.
composeBom = "2026.06.01"

# Test
# kotlin-test-junit is kotlin.test's JUnit 4 backend (brings junit:junit 4.13.x
# transitively). Chosen over org.junit.Assert.* because the M0-T02 test source
# uses the kotlin.test argument order (message last).
#
# M0-T04 first needs Robolectric (local JVM Room/SQLite integration tests).
# Robolectric 4.17 is the newest stable; tests pin @Config(sdk = [34]) because
# Robolectric's instrumented android-all artifacts lag the installed platforms.
# androidx.test:core provides ApplicationProvider; 1.7.0 is the newest stable.
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
# Instrumented runner + AndroidJUnit4 for :core:storage's device pass (M0-T11).
# 1.7.0 / 1.3.0 are the current stable releases matched to androidx.test:core 1.7.0.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Coroutines
# 1.11.0 is the newest stable release; it is built against Kotlin stdlib 2.2.20,
# whose metadata is readable by the resolved Kotlin 2.3.21 toolchain (backward
# compatible), and it is the version :core:common's DispatchersProvider exposes.
coroutines = "1.11.0"

# kotlinx-serialization. 1.11.0 is the newest stable and is built against
# kotlin-stdlib 2.3.20, i.e. it is aligned with the resolved Kotlin 2.3.21
# toolchain. Used by :core:storage's quarantine sidecar codec (M0-T08) instead
# of org.json, which is stubbed in JVM unit tests.
kotlinxSerialization = "1.11.0"

# Processing / libraries later M0 tasks consume
hilt = "2.60.1"
room = "2.8.5"
media3 = "1.11.1"
coil = "3.6.3"
work = "2.11.2"
paging = "3.5.1"

[libraries]
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }

coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
