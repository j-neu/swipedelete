[versions]
# Build toolchain. Pinned to the mutually-compatible set resolved by M0-T01
# (see docs/ANDROID-CONSTRAINTS.md "V1 addendum — resolved catalog"):
#   Kotlin 2.3.21 (KGP fully supported with Gradle 7.6.3-9.3.0, AGP 8.2.2-9.0.0)
#   KSP 2.3.12    (documented KGP support 2.2.10-2.3.x)
#   AGP 8.13.2    (max API 36.1, min Gradle 8.13; keeps the kotlin-android plugin,
#                  which AGP 9.x deprecates in favour of built-in Kotlin)
#   Gradle 8.14.5 (wrapper; inside Kotlin 2.3.21's range and above AGP 8.13's min)
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.12"

# Androidx / Compose
# 2026.06.01 (Compose UI 1.11.4, Material3 1.4.0) is the newest BOM whose AAR
# metadata stays at minCompileSdk 35 / minAGP 8.6.0. BOM 2026.08.00 (UI 1.12.0)
# and newer require compileSdk 37 + AGP 9.1.0, which the compileSdk 36 decision
# rules out.
composeBom = "2026.06.01"

# Navigation + Activity (M0-T15 app shell). navigation 2.9.8 is the newest 2.9.x
# and the release this task built and tested against; the 2.10.x line was not
# verified against the compileSdk 36 / AGP 8.13.2 pin above and is not needed by
# M0. activity-compose 1.10.1 is the matching stable Activity release.
navigation = "2.9.8"
activityCompose = "1.10.1"

# Test
# kotlin-test-junit is kotlin.test's JUnit 4 backend (brings junit:junit 4.13.x
# transitively). Chosen over org.junit.Assert.* because the M0-T02 test source
# uses the kotlin.test argument order (message last).
#
# M0-T04 first needs Robolectric (local JVM Room/SQLite integration tests).
# Robolectric 4.17 is the newest stable; tests pin @Config(sdk = [34]) because
# Robolectric's instrumented android-all artifacts lag the installed platforms.
# androidx.test:core provides ApplicationProvider; 1.7.0 is the newest stable.
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
# Instrumented runner + AndroidJUnit4 for :core:storage's device pass (M0-T11).
# 1.7.0 / 1.3.0 are the current stable releases matched to androidx.test:core 1.7.0.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Coroutines
# 1.11.0 is the newest stable release; it is built against Kotlin stdlib 2.2.20,
# whose metadata is readable by the resolved Kotlin 2.3.21 toolchain (backward
# compatible), and it is the version :core:common's DispatchersProvider exposes.
coroutines = "1.11.0"

# kotlinx-serialization. 1.11.0 is the newest stable and is built against
# kotlin-stdlib 2.3.20, i.e. it is aligned with the resolved Kotlin 2.3.21
# toolchain. Used by :core:storage's quarantine sidecar codec (M0-T08) instead
# of org.json, which is stubbed in JVM unit tests.
kotlinxSerialization = "1.11.0"

# Processing / libraries later M0 tasks consume
#
# Hilt is pinned to 2.58, NOT the newest stable 2.60.1 that M0-T01's constraints
# review resolved. Dagger 2.59 made the Hilt Gradle plugin require AGP 9.0.0+
# ("Updated minimum required AGP version to 9.0.0", Dagger 2.59 release notes),
# and this project deliberately stays on AGP 8.13.2 (AGP 9 deprecates the
# org.jetbrains.kotlin.android plugin — see the toolchain comment above).
# 2.58 is the last release before that requirement, so it is the newest Hilt
# whose Gradle plugin applies to AGP 8.13.2. Verified empirically (M0-T15):
# 2.60.1 -> "The Hilt Android Gradle plugin is only compatible with AGP 9.0.0
# or higher (found 8.13.2)".
hilt = "2.58"
room = "2.8.5"
media3 = "1.11.1"
coil = "3.6.3"
work = "2.11.2"
paging = "3.5.1"

# M0-T16 (:feature:settings). A @HiltViewModel is not resolvable from inside a
# NavHost destination with plain `viewModel()`: NavBackStackEntry's default
# factory is a bare SavedStateViewModelFactory (verified against
# navigation-common 2.9.8's NavBackStackEntryImpl), not the activity's Hilt
# factory. androidx.hilt's navigation-compose integration supplies the one that
# is, so the onboarding/settings routes can own their @HiltViewModel.
# 1.2.0 is the newest stable androidx.hilt release; it is version-independent of
# the Dagger hilt = "2.58" pin above.
hiltNavigationCompose = "1.2.0"
# Lifecycle artifacts consumed by :feature:settings' view models and screens.
# 2.9.4 is the release navigation 2.9.8 resolves against in this project.
lifecycle = "2.9.4"

